
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JPCS - PTC</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-box">

        <div class="logos">
            <img src="assets/jpcs-logo-fixed.png" alt="JPCS Logo">
            <img src="assets/ptc-seal-official.png" alt="PTC Logo">
        </div>

        <h1>JPCS - PTC</h1>
        <h2>Account Login</h2>
        <p>Welcome to the JPCS membership portal.</p>

        <form id="loginForm" novalidate>

            <label for="loginEmail">Institutional Email / Officer Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter institutional or officer email"
                autocomplete="username"
                required
            >
            <small class="hint">
                Students: use your PTC email. Officers: use your assigned account.
            </small>
            <small id="emailError" class="error"></small>

            <label for="loginPassword">Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button type="button" id="showPassword">
                    Show
                </button>
            </div>

            <small id="passwordError" class="error"></small>

            <div class="forgot">
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Log In
            </button>

        </form>

        <p class="register">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

        <a href="index.html" class="back">Back to Home</a>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
